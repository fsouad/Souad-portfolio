
<!DOCTYPE html>
<html>
<head>
<style>
  .box {
    display: flex;
    gap: 20px;
    justify-content: center;
  }
  .card {
    background: #f0f0f0;
    padding: 20px;
    border-radius: 10px;
    width: 200px;
    text-align: center;
    border-top: 4px solid #007bff;
  }
  .whatsapp-btn {
    display: block;
    background: #25D366;
    color: white;
    padding: 15px 30px;
    border-radius: 50px;
    text-align: center;
    text-decoration: none;
    font-weight: bold;
    margin: 30px auto;
    width: fit-content;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37,211,102,0.7); }
    70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(37,211,102,0); }
    100% { transform: scale(1); }
  }
  @media (max-width: 600px) {
    .box { flex-direction: column; align-items: center; }
  }
</style>
</head>
<body>

<div class="box">
    <div class="card">🎨 PSD to HTML</div>
    <div class="card">📱 Landing Page</div>
    <div class="card">🔧 Bug Fixes</div>
</div>

<a href="https://wa.me/216XXXXXXXX" class="whatsapp-btn">
  💬 احكي معايا على WhatsApp
</a>

</body>
</html>
