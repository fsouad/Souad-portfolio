<!DOCTYPE html>
<html>
<head>
<style>
  .box {
    display: flex;
    gap: 20px;
    justify-content: center;
  }
  .card {
    background: #f0f0f0;
    padding: 20px;
    border-radius: 10px;
    width: 200px;
    text-align: center;
    border-top: 4px solid #007bff;
  }
  @media (max-width: 600px) {
    .box { flex-direction: column; align-items: center; }
  }
</style>
</head>
<body>
<div class="box">
    <div class="card">🎨 PSD to HTML</div>
    <div class="card">📱 Landing Page</div>
    <div class="card">🔧 Bug Fixes</div>
</div>
</body>
</html>
